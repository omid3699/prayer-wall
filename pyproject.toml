[project]
name = "prayer-wall"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django>=6.0.2",
    "djangorestframework>=3.16.1",
    "drf-spectacular>=0.27.2",
    "django-filter>=2.4.0",
    "psycopg-binary>=3.3.2",
    "python-dotenv>=1.0.0",
    "dj-database-url>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-django>=4.9.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.15.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
testpaths = ["apps"]

[tool.ruff]
line-length = 88
indent-width = 4
exclude = [
    ".venv",
    "build",
    "dist",
    "migrations",
    "__pycache__",
    ".git",
]
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "D",
    "DJ",
    "UP",
    "B",
    "C4",
    "SIM",
    "TID",
    "RUF",
]
ignore = [
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D106",
    "D203",
    "D213",
    "E501",
]
# Note: D203/D211 and D212/D213 are mutually exclusive; see Ruff docs for details.

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]
combine-as-imports = true
force-single-line = false
lines-after-imports = 2

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
